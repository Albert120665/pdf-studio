<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#c41e3a">
<meta name="mobile-web-app-capable" content="yes">
<title>PDF Studio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- Kopfleiste -->
<header id="topbar">
  <button class="ib" id="btnMenu" title="Menü" aria-label="Menü"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  <div id="docTitle">PDF Studio</div>
  <button class="ib" id="btnUndo" title="Rückgängig" aria-label="Rückgängig" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <button class="ib" id="btnRedo" title="Wiederholen" aria-label="Wiederholen" disabled><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  <button class="ib" id="btnSearch" title="Suchen" aria-label="Suchen"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
  <button class="ib" id="btnPages" title="Seiten verwalten" aria-label="Seiten"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="9" rx="1"/><rect x="3" y="15" width="7" height="6" rx="1"/><rect x="14" y="15" width="7" height="6" rx="1"/></svg></button>
  <button class="primary" id="btnSave" title="Speichern" disabled><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg><span>Speichern</span></button>
</header>

<!-- Suchleiste -->
<div id="searchbar" hidden>
  <input id="searchInput" type="search" placeholder="Im Dokument suchen …" enterkeyhint="search">
  <span id="searchInfo"></span>
  <button class="ib" id="searchPrev" aria-label="Vorheriger"><svg viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg></button>
  <button class="ib" id="searchNext" aria-label="Nächster"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
  <button class="ib" id="searchClose" aria-label="Schließen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</div>

<!-- Dokument -->
<main id="viewer" tabindex="0">
  <div id="pages"></div>
  <div id="welcome">
    <img src="icons/icon-192.png" alt="" width="96" height="96">
    <h1>PDF Studio</h1>
    <p>PDFs ansehen, ausfüllen, unterschreiben und kommentieren – ohne Abo, ohne Werbung, alles bleibt auf deinem Gerät.</p>
    <button class="primary big" id="btnOpenWelcome">PDF öffnen</button>
    <button class="big" id="btnResume" hidden>Weiterarbeiten</button>
    <p class="hint">Tipp: In der Dateien-App eine PDF <b>teilen → PDF Studio</b> öffnet sie direkt hier.</p>
  </div>
</main>

<div id="pageIndicator" hidden></div>

<!-- Zoom -->
<div id="zoombox" hidden>
  <button class="ib" id="zoomOut" aria-label="Verkleinern"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  <button id="zoomFit" title="Seitenbreite">100%</button>
  <button class="ib" id="zoomIn" aria-label="Vergrößern"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<!-- Auswahl-Leiste (Text markiert) -->
<div id="selbar" hidden>
  <button data-mark="highlight"><span class="sw hl"></span>Markieren</button>
  <button data-mark="underline"><u>U</u> Unterstr.</button>
  <button data-mark="strike"><s>S</s> Durchstr.</button>
  <button id="selCopy">Kopieren</button>
</div>

<!-- Element-Leiste (Kommentar ausgewählt) -->
<div id="itembar" hidden>
  <button id="itEdit">Bearbeiten</button>
  <button id="itColor">Farbe</button>
  <button id="itDup">Duplizieren</button>
  <button id="itCopy">Kopieren</button>
  <button id="itDel" class="danger">Löschen</button>
</div>

<!-- Werkzeug-Optionen -->
<div id="toolopts" hidden>
  <div class="colors" id="colorRow"></div>
  <label class="wlabel">Stärke <input type="range" id="widthRange" min="1" max="12" step="0.5" value="2"></label>
</div>

<!-- Werkzeuge -->
<nav id="toolbar">
  <button data-tool="view" class="active"><svg viewBox="0 0 24 24"><path d="M9 11V5a1.5 1.5 0 0 1 3 0v5m0-1V4a1.5 1.5 0 0 1 3 0v6m0-3a1.5 1.5 0 0 1 3 0v6a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-2.7L3.5 13a1.6 1.6 0 0 1 2.6-1.8L9 14"/></svg><span>Ansehen</span></button>
  <button data-tool="text"><svg viewBox="0 0 24 24"><path d="M5 5h14M12 5v14M9 19h6"/></svg><span>Text</span></button>
  <button data-tool="check"><svg viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></svg><span>Haken</span></button>
  <button data-tool="cross"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg><span>Kreuz</span></button>
  <button data-tool="sign"><svg viewBox="0 0 24 24"><path d="M3 17c3-6 5-9 6-7s-2 7 0 7 3-5 5-5 1 4 3 4 2-2 4-2M3 21h18"/></svg><span>Unterschrift</span></button>
  <button data-tool="ink"><svg viewBox="0 0 24 24"><path d="M4 20c4-1 6-4 9-7l5-5-2-2-5 5c-3 3-6 5-7 9z"/></svg><span>Stift</span></button>
  <button data-tool="marker"><svg viewBox="0 0 24 24"><path d="m9 15 7-11 4 3-7 11z"/><path d="M5 21h14" stroke="#e8c300" stroke-width="4"/></svg><span>Marker</span></button>
  <button data-tool="rect"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg><span>Rechteck</span></button>
  <button data-tool="ellipse"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="6.5"/></svg><span>Ellipse</span></button>
  <button data-tool="arrow"><svg viewBox="0 0 24 24"><path d="M5 19 19 5m0 0h-8m8 0v8"/></svg><span>Pfeil</span></button>
  <button data-tool="line"><svg viewBox="0 0 24 24"><path d="M5 19 19 5"/></svg><span>Linie</span></button>
  <button data-tool="image"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 17-5-5-9 8"/></svg><span>Bild</span></button>
  <button data-tool="whiteout"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="10" rx="1" fill="#fff"/><path d="M8 12h8" stroke-dasharray="2 2"/></svg><span>Abdecken</span></button>
  <button data-tool="redact"><svg viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="8" fill="currentColor"/></svg><span>Schwärzen</span></button>
</nav>

<!-- Menü -->
<div id="menu" class="sheet" hidden>
  <div class="sheet-inner">
    <button data-act="open">📂 PDF öffnen</button>
    <button data-act="save" class="needdoc">⬇️ Speichern (Download)</button>
    <button data-act="share" class="needdoc">📤 Teilen / Senden</button>
    <button data-act="paste" class="needdoc">📋 Einfügen (Text/Bild aus Zwischenablage)</button>
    <button data-act="pages" class="needdoc">🗂️ Seiten verwalten</button>
    <button data-act="merge" class="needdoc">➕ PDF anhängen</button>
    <button data-act="print" class="needdoc">🖨️ Drucken</button>
    <button data-act="close" class="needdoc">✖️ Dokument schließen</button>
    <button data-act="install" id="menuInstall" hidden>📲 App installieren</button>
    <button data-act="about">ℹ️ Über PDF Studio</button>
  </div>
</div>

<!-- Seitenverwaltung -->
<div id="pagesheet" class="fullsheet" hidden>
  <header class="fs-head">
    <button class="ib" id="pagesClose" aria-label="Zurück"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="fs-title">Seiten</div>
    <button id="pgBlank">+ Leere Seite</button>
    <button id="pgMerge">+ PDF</button>
  </header>
  <div id="pagegrid"></div>
</div>

<!-- Dialog -->
<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h2 id="dlgTitle"></h2>
    <div id="dlgBody"></div>
    <div class="dlg-btns">
      <button value="ok" class="primary" id="dlgOk">OK</button>
      <button value="cancel" id="dlgCancel">Abbrechen</button>
    </div>
  </form>
</dialog>

<div id="toast" hidden></div>
<input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>
<input type="file" id="mergeInput" accept="application/pdf,.pdf" hidden>
<input type="file" id="imageInput" accept="image/*" hidden>

<script type="module" src="app.js"></script>
</body>
</html>
